name: Build BitAnime Pro v21.9 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore exact v21.9 source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/source-v21.9.zip.b64
          base64 --decode .github/source-v21.9.zip.b64 > /tmp/bitanime-v21.9.zip
          unzip -t /tmp/bitanime-v21.9.zip
          unzip -oq /tmp/bitanime-v21.9.zip -d .
          test -s index.html
          test -s package.json
          test -s capacitor.config.json
          test -s scripts/patch_android.py
          node -e "if(require('./package.json').version !== '21.9.0') process.exit(1)"
          echo "Verified BitAnime source version 21.9.0"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 35 and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/manifest.json; fi
          if [ -f assets/icon-512.png ]; then cp assets/icon-512.png www/icon.png; fi
          npm install
          npx cap add android
          npx cap copy android

      - name: Generate app icons and splash screens
        shell: bash
        run: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#050608' --splashBackgroundColor '#050608'
          fi

      - name: Apply BitAnime Android permissions and native bridge
        run: python3 scripts/patch_android.py

      - name: Set Android v21.9 version metadata
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          s, code_n = re.subn(r"versionCode\s+\d+", "versionCode 21900", s, count=1)
          s, name_n = re.subn(r"""versionName\s+["'][^"']+["']""", 'versionName "21.9"', s, count=1)
          if code_n != 1 or name_n != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          p.write_text(s, encoding="utf-8")
          print("Android version set to 21.9 (versionCode 21900)")
          PYEOF

      - name: Configure regional Maven fallback
        shell: bash
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          mirror = 'maven { url "https://maven-central-asia.storage-download.googleapis.com/maven2/" }'
          for path in Path("android").rglob("*.gradle"):
              content = path.read_text(encoding="utf-8")
              if "mavenCentral()" in content and mirror not in content:
                  content = content.replace("mavenCentral()", mirror + "\n        mavenCentral()")
                  path.write_text(content, encoding="utf-8")
          PYEOF

      - name: Build signed release APK or installable debug APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          BUILD_OK=0
          if [ -n "$KEYSTORE_BASE64" ]; then
            for attempt in 1 2 3; do
              echo "Gradle release build attempt $attempt/3"
              if ./gradlew assembleRelease --no-daemon --max-workers=2; then BUILD_OK=1; break; fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            done
            test "$BUILD_OK" = "1"
            cd ..
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            "$BUILD_TOOLS/zipalign" -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out BitAnime-Pro-v21.9.apk \
              app-aligned.apk
          else
            for attempt in 1 2 3; do
              echo "Gradle debug build attempt $attempt/3"
              if ./gradlew assembleDebug --no-daemon --max-workers=2; then BUILD_OK=1; break; fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            done
            test "$BUILD_OK" = "1"
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk BitAnime-Pro-v21.9.apk
          fi

      - name: Verify APK signature and output
        shell: bash
        run: |
          set -euo pipefail
          test -s BitAnime-Pro-v21.9.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose BitAnime-Pro-v21.9.apk
          ls -lh BitAnime-Pro-v21.9.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitAnime-Pro-v21.9-APK
          path: BitAnime-Pro-v21.9.apk
          if-no-files-found: error
          retention-days: 30
