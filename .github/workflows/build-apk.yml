name: Build BitAnime Pro v19.7 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore v19.7 source from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/source-v19.7.zip.b64 > /tmp/bitanime-v19.7.zip
          unzip -o /tmp/bitanime-v19.7.zip -d .

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Self-Contained Offline Web Bundle & Capacitor 7
        run: |
          mkdir -p www
          FOUND_HTML=$(find . -maxdepth 3 -name "index.html" -not -path "./www/*" -not -path "./android/*" | head -n 1)
          if [ -n "$FOUND_HTML" ]; then
            cp "$FOUND_HTML" www/index.html
          elif [ -f www/index.html ]; then
            echo "Using existing www/index.html"
          else
            echo "ERROR: index.html not found!"
            exit 1
          fi
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f assets/icon-512.png ] && cp assets/icon-512.png www/icon.png || true
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install -D @capacitor/assets@3
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Apply BitAnime App Icons & Splash Screen
        run: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#141821' --splashBackgroundColor '#141821' || true
          fi

      - name: Inject v19.7 Android System Bars + Smooth WebView Bridge
        run: |
          python3 scripts/patch_android.py

      - name: Build Signed Release APK (If Secrets Set) or Clean Debug APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            cd ..
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            "$BUILD_TOOLS/zipalign" -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out BitAnime-Pro-v19.7.apk \
              app-aligned.apk
          else
            ./gradlew assembleDebug --no-daemon
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk BitAnime-Pro-v19.7.apk
          fi

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitAnime-Pro-v19.7-APK
          path: BitAnime-Pro-v19.7.apk